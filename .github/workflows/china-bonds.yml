name: China government bonds

# Daily, after ChinaBond (CCDC) publishes the day's curve (~17:30 Beijing; CFETS valuations ~18:00): update the CGB master list
# (new bond codes, ISINs, coupons, maturities from CFETS), rebuild data/china.json and data/bond-lending.json (CFETS bond lending fees) and commit them, so the
# deploy always has a fresh committed copy even if a later live fetch fails. The deploy workflow also
# re-fetches data/china.json on every refresh for intraday CFETS traded yields.
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Re-read every bond's detail (slow, ~15 min)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - scripts/fetch-pb-master.mjs
      - scripts/fetch-cgb-master.mjs
      - scripts/fetch-china.mjs
      - .github/workflows/china-bonds.yml
  schedule:
    - cron: "45 10 * * *"     # 18:45 Singapore / Beijing, every day (catches weekend make-up workdays; heartbeat.yml also dispatches it at 18:45)
    - cron: "10 1 * * 1-5"    # 09:10, catches a curve published late the evening before
    - cron: "35 14 * * 1-5"   # 22:35, after CFETS publishes the day's bond lending bulletin (22:00 Beijing)

permissions:
  contents: write
  actions: write

concurrency:
  group: china-bonds
  cancel-in-progress: false

jobs:
  china:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update the CGB master list (code, ISIN, coupon, maturity)
        run: node scripts/fetch-cgb-master.mjs ${{ inputs.full && '--full' || '' }} || echo "master update failed; keeping the committed list"

      - name: Update the policy bank bond list (every CDB, ADBC, EXIM bond on the CFETS list; ISIN, coupon, maturity)
        run: node scripts/fetch-pb-master.mjs ${{ inputs.full && '--full' || '' }} || echo "policy bank master update failed; keeping the committed list"

      - name: CCDC curve, history and CFETS bond yields
        run: node scripts/fetch-china.mjs

      - name: CFETS bond lending fees (daily and monthly, by tenor)
        run: node scripts/fetch-bond-lending.mjs || echo "bond lending fetch failed; keeping the committed file"

      - name: Bond-equity rotation flows and signal (CSI 300, CN10Y, margin balance, ETF turnover)
        run: node scripts/fetch-china-flows.mjs || echo "flows build failed; keeping the committed file"

      - name: Commit if changed
        id: commit
        run: |
          git add data/cgb-master.json data/china.json data/bond-lending.json data/china-flows.json
          if [ -f data/pb-master.json ]; then git add data/pb-master.json; fi
          if git diff --cached --quiet; then
            echo "No changes."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Refresh China government bond curve and bond list"
          git pull -q --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
