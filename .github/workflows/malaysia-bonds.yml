name: Malaysia government bonds

# Daily after Bank Negara Malaysia's FAST publishes the consolidated indicative yields (MGS, GII and corporate curves)
# and the day's ETP trades are final (after 18:00 Kuala Lumpur): rebuild data/malaysia.json (MGS curve and history,
# GII and corporate curves, MGS / GII by stock code and ISIN, benchmarks, OPR, bills and the KL USD/MYR reference rate)
# and data/malaysia-flows.json (KLCI <-> MGS foreign-flow signal and US Treasury transmission study), commit them and
# redeploy. Each run also back-fills older FAST days until the history is complete.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch-malaysia.mjs
      - scripts/fetch-malaysia-flows.mjs
      - scripts/fetch-malaysia-credit.mjs
      - scripts/ust-transmission.mjs
      - .github/workflows/malaysia-bonds.yml
  schedule:
    - cron: "25 11 * * 1-5"   # 19:25 Singapore / Kuala Lumpur, after FAST's evening release and the final ETP trades
    - cron: "45 14 * * 1-5"   # 22:45, late releases
    - cron: "55 0 * * 2-6"    # 08:55 next morning, safety net (also picks up the overnight US Treasury close)

permissions:
  contents: write
  actions: write

concurrency:
  group: malaysia-bonds
  cancel-in-progress: false

jobs:
  malaysia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: MGS / GII / corporate curves (FAST), bonds by stock code and ISIN, benchmarks, OPR and USD/MYR (BNM)
        run: node scripts/fetch-malaysia.mjs || echo "malaysia fetch failed; keeping the committed file"

      - name: Financial and SOE bonds (BIX Malaysia)
        run: node scripts/fetch-malaysia-credit.mjs || echo "credit fetch failed; keeping the committed file"

      - name: KLCI <-> MGS flows and US Treasury transmission
        run: node scripts/fetch-malaysia-flows.mjs || echo "flows build failed; keeping the committed file"

      - name: Commit if changed
        id: commit
        run: |
          for f in data/malaysia.json data/malaysia-flows.json data/malaysia-credit.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "No changes."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Refresh Malaysia government bond data"
          # Other workflows and the daily tasks push too; retry if one lands between the pull and the push.
          ok=0
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push && { ok=1; break; }
            echo "push rejected (attempt $i); retrying"; sleep $((i * 5))
          done
          [ "$ok" = 1 ]
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
