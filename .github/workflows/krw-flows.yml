name: USD/KRW equity flows

# Daily after the Seoul close (KRX investor flows are final ~16:00 KST): fetch USD/KRW, the dollar index, USD/CNH, the
# KOSPI and its turnover, and KOSPI net buying by investor type, rebuild data/krw-flows.json (the FX tab's USD/KRW
# equity flow signal) and commit it. The hand-written `notes` key is kept.
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Most Naver pages per series this run (first run back-fills ~3 years)"
        type: string
        default: "200"
  push:
    branches: [main]
    paths:
      - scripts/fetch-krw-flows.mjs
      - scripts/krw-signal.mjs
      - .github/workflows/krw-flows.yml
  schedule:
    - cron: "30 8 * * 1-5"    # 16:30 SGT / 17:30 KST
    - cron: "45 13 * * 1-5"   # 21:45 SGT, catches late revisions and the latest USD/KRW

permissions:
  contents: write

concurrency:
  group: krw-flows
  cancel-in-progress: false

jobs:
  krw:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: KOSPI investor flows from KRX (needs the KRX_ID / KRX_PW secrets)
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          if [ -z "$KRX_ID" ]; then echo "KRX_ID / KRX_PW secrets not set: macro-only build"; exit 0; fi
          pip install -q pykrx
          if [ -f data/krw-flows.json ] && python3 -c "import json,sys;d=json.load(open('data/krw-flows.json'));sys.exit(0 if len(d.get('raw',{}).get('flows',[]))>200 else 1)"; then
            FROM=$(date -u -d '20 days ago' +%F)
          else
            FROM=2023-07-01
          fi
          python3 scripts/krx-flows.py "$FROM" "$(TZ=Asia/Seoul date +%F)"

      - name: USD/KRW, KOSPI and investor flows, then the signal
        run: node scripts/fetch-krw-flows.mjs --pages ${{ inputs.pages || '200' }}

      - name: Commit if changed
        run: |
          [ -f data/krw-flows.json ] || { echo "No data file (a source failed; see the step above)."; exit 1; }
          git add data/krw-flows.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Refresh USD/KRW equity flows"
          # Other workflows and the daily tasks push too; retry if one lands between the pull and the push.
          ok=0
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push && { ok=1; break; }
            echo "push rejected (attempt $i); retrying"; sleep $((i * 5))
          done
          [ "$ok" = 1 ]
