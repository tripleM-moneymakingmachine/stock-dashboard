name: probe-id
# Test run of the Indonesia tab fetchers on the probe-id branch; never on main.
on:
  push:
    branches: [probe-id]
    paths: [scripts/probe-id.mjs, scripts/fetch-indonesia.mjs, scripts/fetch-indonesia-flows.mjs, scripts/ust-transmission.mjs, .github/workflows/probe-id.yml]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          { echo "== fetch-indonesia"; node scripts/fetch-indonesia.mjs; echo "exit $?"; echo "== fetch-indonesia-flows"; node scripts/fetch-indonesia-flows.mjs; echo "exit $?"; } > probe-out.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe-out.txt; for f in data/indonesia.json data/indonesia-flows.json; do [ -f "$f" ] && git add -f "$f"; done
          git commit -m "probe output" && git push
