name: probe-id
# One-off check of which Indonesian data sources GitHub Actions can reach (Indonesia tab build).
# Runs only on the probe-id branch; never on main.
on:
  push:
    branches: [probe-id]
    paths: [scripts/probe-id.mjs, .github/workflows/probe-id.yml]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe-id.mjs > probe-out.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe-out.txt; git commit -m "probe output" && git push
