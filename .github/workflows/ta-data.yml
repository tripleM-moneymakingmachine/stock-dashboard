name: Save daily prices for the technical read

# After each US close, saves every stock's daily OHLC history to the repo and
# writes data/ta-snapshot.json (indicators, swing levels, written-level checks),
# so the daily technical-read refresh can work from the committed data.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ta-data.yml
      - scripts/ta-snapshot.py
      - scripts/build-portfolios.py
      - scripts/momentum-portfolio.py
      - data/portfolios.json
  schedule:
    # 21:25 UTC = 5:25pm EDT / 4:25pm EST, Mon–Fri (after the close either way)
    - cron: "25 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: ta-data
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch daily history
        run: |
          node scripts/fetch-quote.mjs ARM arm/data 2y
          node scripts/fetch-quote.mjs TSLA tesla/data 2y
          node scripts/fetch-quote.mjs SNDK sndk/data 2y
          node scripts/fetch-quote.mjs INTC intc/data 2y
          node scripts/fetch-quote.mjs SPCX spcx/data 2y
          node scripts/fetch-quote.mjs MU mu/data 2y
          node scripts/fetch-quote.mjs LITE lite/data 2y
          node scripts/fetch-quote.mjs COHR cohr/data 2y
          node scripts/fetch-quote.mjs GOOGL googl/data 2y
          node scripts/fetch-quote.mjs META meta/data 2y
          node scripts/fetch-quote.mjs NVDA nvda/data 2y
          node scripts/fetch-quote.mjs ZS zs/data 2y
          node scripts/fetch-quote.mjs BE be/data 2y
          node scripts/fetch-quote.mjs AAOI aaoi/data 2y
          node scripts/fetch-quote.mjs AMD amd/data 2y
          node scripts/fetch-quote.mjs MP mp/data 2y
          node scripts/fetch-quote.mjs AMZN amzn/data 2y
          node scripts/fetch-quote.mjs MSFT msft/data 2y
          node scripts/fetch-quote.mjs MRVL mrvl/data 2y
          node scripts/fetch-quote.mjs SKHY skhy/data 2y
          node scripts/fetch-quote.mjs 000660.KS skhy/data/krx 2y
          node scripts/fetch-quote.mjs TSM tsm/data 2y
          node scripts/fetch-quote.mjs AVGO avgo/data 2y
          node scripts/fetch-quote.mjs ROK rok/data 2y
          node scripts/fetch-quote.mjs AMAT amat/data 2y
          node scripts/fetch-quote.mjs ASML asml/data 2y
          node scripts/fetch-quote.mjs PLTR pltr/data 2y
          node scripts/fetch-quote.mjs GLW glw/data 2y
          node scripts/fetch-quote.mjs TER ter/data 2y

      - name: Build indicator snapshot
        run: python3 scripts/ta-snapshot.py

      - name: Build the momentum portfolio (Portfolio tab)
        run: |
          mkdir -p data/bench/SPY && node scripts/fetch-quote.mjs SPY data/bench/SPY 2y
          python3 scripts/momentum-portfolio.py --text >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch prices for the Pelosi, Trump, Druckenmiller and Thiel panels
        run: |
          for t in SPY $(python3 -c "import json;c=json.load(open('data/portfolios.json'));print(' '.join(sorted({h[0] for k in c for h in c[k]['holdings']})))"); do
            mkdir -p pf-data/$t && node scripts/fetch-quote.mjs $t pf-data/$t 1y
          done

      - name: Build portfolio performance and check for new filings
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python3 scripts/build-portfolios.py pf-data

      - name: Save the NDF forward curves at the New York close (FX tab history)
        run: |
          node scripts/fetch-fx.mjs || echo "fx fetch failed"
          FWD_CLOSE=1 node scripts/fetch-fwd.mjs || echo "NDF forwards fetch failed"

      - name: Commit if changed
        run: |
          git add */data/history.json skhy/data/krx/history.json data/ta-snapshot.json data/portfolios-perf.json data/momentum-portfolio.json data/bench/SPY/history.json
          if [ -f data/fx-fwd.json ]; then git add data/fx-fwd.json; fi
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Save daily prices for the technical read"
          git pull -q --rebase --autostash origin main
          git push
