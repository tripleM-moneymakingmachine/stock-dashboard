name: Nasdaq fear & greed factor

# Stocks tab: rebuilds data/fear-greed.json (the panel above the previous-session recap) from Yahoo daily closes
# for the Nasdaq Composite, the VIX and gold futures after each US close, then commits it and redeploys.
# A failed fetch keeps the committed file.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch-fear-greed.mjs", ".github/workflows/fear-greed.yml"]
  schedule:
    - cron: "40 21 * * 1-5"   # 05:40 Singapore (16:40 New York, EST; 17:40 EDT)
    - cron: "40 23 * * 1-5"   # 07:40 Singapore: second try, GitHub often drops cron runs

permissions:
  contents: write
  actions: write

concurrency:
  group: fear-greed
  cancel-in-progress: false

jobs:
  factor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the factor
        run: node scripts/fetch-fear-greed.mjs

      - name: Commit if changed
        id: commit
        run: |
          git add data/fear-greed.json
          if git diff --cached --quiet; then
            echo "No changes."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Refresh Nasdaq fear & greed factor ($(TZ=Asia/Singapore date '+%Y-%m-%d %H:%M') SGT)"
          ok=0
          for i in 1 2 3 4 5; do
            git pull -q --rebase --autostash origin main && git push && { ok=1; break; }
            echo "push rejected (attempt $i); retrying"; sleep $((i * 5))
          done
          [ "$ok" = 1 ]
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
